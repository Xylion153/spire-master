:root{--ink:#1d1230;--p0:#1b1233;--gold:#ffcf4a;--teal:#4fe0c8;--pink:#ff6fae;--red:#ff5a6a;--text:#f6f0ff;--mist:#c3b5ea;--display:'Lilita One','Arial Black',sans-serif;--body:'Nunito',system-ui,sans-serif;
  --sw:clamp(330px,56%,560px);--rail:58px;--tile:#33275f;--tile2:#271c4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#120b24;color:var(--text);font-family:var(--body);font-weight:700;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;color:inherit}
.hidden,[hidden]{display:none!important}
#vis{position:fixed;inset:0;pointer-events:none;opacity:0}
#app{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;background:var(--p0)}
#c,#c2{position:absolute;inset:0;width:100%;height:100%;display:block}
#c2{pointer-events:none;z-index:3}
/* ---------- top bar (over the scene) ---------- */
#top{position:absolute;left:0;top:0;right:var(--sw);display:flex;align-items:center;gap:6px;padding:8px 10px 0 calc(8px + env(safe-area-inset-left));z-index:5;pointer-events:none}
#top>*{pointer-events:auto}#top .sp{flex:1}
.pill{display:flex;align-items:center;gap:5px;background:linear-gradient(180deg,#3d2d74,#251a4a);border:2px solid var(--ink);border-radius:999px;padding:2px 11px 2px 4px;font:400 17px var(--display);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2);white-space:nowrap}
.pill.sm{font-size:13px;padding:3px 9px}.pill.inc{color:#9df5b4}
.coin{display:inline-block;flex:none;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffcf4a 45%,#d98a00);border:2px solid var(--ink)}
.ib{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:linear-gradient(#3d2d74,#251a4a);display:grid;place-items:center;padding:0;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.ib svg{width:18px;height:18px}
/* ---------- right panel ---------- */

<script>
(function(){
/* ===== Spire Master : helpers, persistence, audio ===== */
const $=id=>document.getElementById(id);

const fmt=n=>Math.round(n).toLocaleString();

/* cloud save (only when signed in to the host app; otherwise local only) */
const cloud={ref:null,dirty:false,busy:false,timer:0};
function cloudPush(){ if(!cloud.ref) return; cloud.dirty=true; if(cloud.timer||cloud.busy) return; cloud.timer=setTimeout(cloudFlush,3000); }
async function cloudFlush(){ cloud.timer=0; if(!cloud.ref||cloud.busy||!cloud.dirty) return; cloud.busy=true; cloud.dirty=false;
  try{ await cloud.ref.set({v:1,ts:save.ts||Date.now(),s:JSON.parse(JSON.stringify(save))}); }catch(e){ cloud.dirty=true; }
  cloud.busy=false; if(cloud.dirty&&!cloud.timer) cloud.timer=setTimeout(cloudFlush,8000); }
function persist(){ save.ts=Date.now(); save.ver=2; save.epoch=RESET_EPOCH; try{ const j=JSON.stringify(save); localStorage.setItem(KEY,j); localStorage.setItem(KEY+'.bak',j); }catch(e){} cloudPush(); }
function toast(msg,col){ const el=$('toast'); el.innerHTML=msg; el.style.color=col||'#fff'; el.hidden=false; el.style.animation='none'; void el.offsetWidth; el.style.animation=''; clearTimeout(toast.t); toast.t=setTimeout(()=>{ el.hidden=true; },2800); }
/* ---------- audio ---------- */
const AUD={ctx:null,sfx:null,mus:null};
function audioInit(){
  if(AUD.ctx){ if(AUD.ctx.state==='suspended') AUD.ctx.resume(); return; }
  try{ const C=window.AudioContext||window.webkitAudioContext; if(!C) return; const c=new C(); AUD.ctx=c;
    const comp=c.createDynamicsCompressor(); comp.connect(c.destination);
    AUD.sfx=c.createGain(); AUD.sfx.gain.value=save.mute?0:.8; AUD.sfx.connect(comp);
    AUD.mus=c.createGain(); AUD.mus.gain.value=(save.mute||!save.music)?0:.5; const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3600; AUD.mus.connect(lp); lp.connect(comp);
    AUD.noise=(()=>{ const b=c.createBuffer(1,c.sampleRate,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; })();

  }catch(e){}
}
function applyVol(){ if(!AUD.ctx) return; AUD.sfx.gain.value=save.mute?0:.8; AUD.mus.gain.value=(save.mute||!save.music)?0:.5; }
function tone(dst,f,t,dur,type,v,att,f2){ const c=AUD.ctx,o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);

const mf=n=>440*Math.pow(2,(n-69)/12);
function sfx(k,a){ if(!AUD.ctx||save.mute) return; const c=AUD.ctx,t=c.currentTime,d=AUD.sfx;
  if(k==='tap') tone(d,520,t,.07,'triangle',.12,.003,700);

  else if(k==='crit') { nz(d,t,.14,.3,'bandpass',1400); tone(d,260,t,.16,'sawtooth',.14,.003,90); tone(d,880,t+.02,.1,'triangle',.1); }
  else if(k==='ehit') { nz(d,t,.08,.18,'bandpass',700); tone(d,120,t,.1,'square',.09,.003,60); }
  else if(k==='heal'){ [0,.07,.14].forEach((o,i)=>tone(d,mf(72+i*4),t+o,.25,'sine',.1)); }
  else if(k==='cast'){ tone(d,300,t,.3,'sawtooth',.07,.01,900); tone(d,600,t+.05,.25,'triangle',.08,.01,1200); }

function potGain(h,v,why){ if(!h||h.rar>=4) return; const k=1+(3-Math.min(3,h.rar))*.3; h.pot=(h.pot||0)+Math.round(v*k); if(why) rlog(h.name.split(' ')[0]+' '+why+'.'); }
function tryAwaken(h){ if(!h||h.rar>=4) return false; const need=POT_NEED[h.rar]; if((h.pot||0)<need) return false; h.pot-=need; h.rar++; if(h.civ){ h.civ=false; h.name=h.name.replace(/ the .*/,''); } h.awoke=(h.awoke||0)+1; return true; }

function weekKey(){ const d=new Date(), y=d.getUTCFullYear(), s=Date.UTC(y,0,1); return y+'-'+Math.floor((Date.now()-s)/6048e5); }
function weekly(){ const k=weekKey(); let h=0; for(const ch of k) h=(h*31+ch.charCodeAt(0))>>>0; return WEEKLY[h%WEEKLY.length]; }
function trialGate(){ let g=0; for(let i=3;i>=0;i--) if(save.unlocked[i]){ g=i; break; } return g; }
function trialReward(){ const g=trialGate(), w=weekly(); return {gold:Math.round(250*(g+1)*(g+1)*(w.id==='civ'?2:1)),relic:true}; }

function canStart(party){
  if(!party.length||save.inRun) return 'Add a hero';
  if(save.dsel===4){ const w=weekly(); if(save.trialDone===weekKey()) return 'Trial done this week'; if(!w.ok(party)) return w.why; return ''; }
  return save.unlocked[save.dsel]?'':'Locked';

function msReward(f){ const z=zoneOf(f); return {gold:Math.round(80*f*(1+z*.6)),relic:f%20===0||f===70||f===100}; }
function checkMilestone(R){

  save.gold+=r.gold; let t='First time clearing floor '+R.floor+'! +'+fmt(r.gold)+' coins sent home'; if(r.relic){ const id=rollRelic(Math.min(5,2+Math.floor(R.floor/25)),R.d); save.relics.push(id); t+=' + '+RELICMAP[id].n; }

function tacticNote(R,k){
  const nm=k==='boss'?bossFor(R.d,R.floor)[0]:miniFor(R.d,R.floor)[0], kn=save.scout&&save.scout[nm], party=R.units.filter(u=>u.alive).map(u=>u.hero), tips=[];
  const fake={name:nm,shape:(k==='boss'?bossFor(R.d,R.floor):miniFor(R.d,R.floor))[1]}, pat=bossPattern(nm,k==='boss');
  if(kn) tips.push('<b style="color:#7dffb0">Scouted.</b> Moves: '+pat.map(m=>'<b>'+moveName(fake,m)+'</b> ('+MOVED[m]+')').join(', ')+'. The party will brace and take 40% less from them.');
  else tips.push('<b style="color:#ff9ab0">Unknown moves.</b> If anyone falls in this fight, we learn its patterns for next time. Cheap mercs make good scouts.');
  if(!party.some(h=>h.cls==='cleric')) tips.push('No healer. Save potions for the big hits.');
  if(party.some(u=>u.cls==='knight')&&pat.indexOf('slam')>=0) tips.push('Have the Knight shield right before the wind-up lands.');
  if(party.some(h=>hasQ(h,'coward'))) tips.push('Someone in this party will run if it gets scary.');
  if(R.units.some(u=>u.alive&&u.mor<30)) tips.push('Morale is low. Rally before the fight starts going badly.');
  if(R.danger) tips.push('Danger '+R.danger+' is on.');
  return '<div class="tnote"><div class="tn-h">Master\'s notes · '+esc(nm)+'</div>'+tips.map(t=>'<div>'+t+'</div>').join('')+'</div>';
}

  for(const [c,slot] of set){ const h=newHero(1,c); save.roster.push(h); if(slot>=0) save.team[slot]=h.id; if(c==='knight') save.captain=h.id; } persist(); }
function volunteers(){ if(save.roster.length) return 0; newBeginning(); return 7; }

function anOff(u,dt){ let x=0,y=0,sq=0,trail=false; const s=S.sc;

  if(u.castA>0){ u.castA-=dt; const k=Math.max(0,u.castA)/.4; y-=Math.sin(k*Math.PI)*8*s; sq-=k*.06; }
  if(u.spawn>0){ u.spawn-=dt; const k=Math.max(0,u.spawn)/.45; y-=k*k*160; if(u.spawn<=0){ anP(u.x,u.y,'#cfc3f5',12,{a:-1.57,spread:3,v:110,m:.45,r:3.5,g:200}); FX.shake=Math.max(FX.shake,.15); } }
